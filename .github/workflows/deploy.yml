# 깃허브 페이지 자동 배포
#
# main 브랜치에 푸시할 때마다 깃허브가 npm run build 를 돌려
# dist/index.html (실습 데이터까지 한 파일로 묶은 결과물) 을 Pages 에 올린다.
# 이렇게 하면 저장소에 dist/ 를 커밋하지 않아도 된다.
#
# configure-pages 의 enablement: true 덕분에 Pages 설정을 손으로 켤 필요가 없다.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 저장소 Actions 탭에서 손으로 실행할 수도 있다

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 계산 정확성 · 문제 은행 모양 점검
        run: npm test

      # 문제 코드를 진짜 파이썬으로 돌려, 지문·보기에 적은 숫자가 데이터와 맞는지 본다
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 문제 정답 점검 (pandas · scikit-learn)
        run: |
          pip install --quiet pandas scikit-learn
          PYTHONUTF8=1 python tools/verify_quiz.py

      # 데이터셋 10종 × 모델 전수 학습. NaN·예외·느려짐을 잡는다 (2~3분)
      - name: 전수 학습 점검
        run: node test/sweep.mjs

      - name: 빌드
        run: npm run build

      # 빌드 결과 점검 — 파일이 있는지, 너무 작지 않은지, 저작권 표시가 남았는지.
      # vite.config.js 도 같은 것을 세지만, 배포 전에 한 번 더 확인한다.
      - name: 빌드 결과 점검
        run: |
          test -f dist/index.html
          size=$(wc -c < dist/index.html)
          echo "dist/index.html = ${size} 바이트"
          test "$size" -gt 500000
          marks=$(grep -c 티쳐무 dist/index.html)
          echo "저작권 표시 ${marks}곳"
          test "$marks" -ge 3

      # Pages 가 아직 꺼져 있으면 여기서 켜 준다.
      # 저장소마다 Actions 기본 권한이 달라 거부될 수 있으므로 빌드를 멈추지 않는다.
      # (거부되면 Settings → Pages → Source 를 「GitHub Actions」 로 한 번 바꿔 주면 된다.
      #  ⚠️ 「Deploy from a branch」 를 고르면 안 된다 — dist/ 를 커밋하지 않으므로 흰 화면이 뜬다.)
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
